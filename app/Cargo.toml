[package]
name = "syllabary"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "syllabary"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
modernrust = { path = "../../ModernRust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "tga"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
miniz_oxide = "0.8"
crc32fast = "1"
pulldown-cmark = "0.13"
krilla = "0.8"
hayro = "0.9"
ureq = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
clone_on_copy = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
manual_ok_or = "warn"
unnecessary_wraps = "warn"

